name: Tagging

on:
  # Legacy upstream multi-browser tagging requires DEPLOY_KEY_PASSWORD.
  # Chrome releases are published separately by chrome-package.yml.
  workflow_dispatch:

jobs:
  tagging:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    name: Release tagging
    
    steps:
      - uses: actions/checkout@v2
        
      - run: bash scripts/tag.sh
        env:
          DEPLOY_KEY_PASSWORD: ${{ secrets.DEPLOY_KEY_PASSWORD }}